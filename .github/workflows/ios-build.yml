name: Build iPhone app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile SwiftUI app
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list -project MihonReader.xcodeproj

      - name: Compile for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild \
            -project MihonReader.xcodeproj \
            -scheme MihonReader \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData/Simulator \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee artifacts/simulator-build.log
          ditto -c -k --keepParent \
            DerivedData/Simulator/Build/Products/Debug-iphonesimulator/MihonReader.app \
            artifacts/MihonReader-Simulator.zip

      - name: Compile unsigned app for iPhone
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project MihonReader.xcodeproj \
            -scheme MihonReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData/iPhone \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee artifacts/iphone-build.log
          ditto -c -k --keepParent \
            DerivedData/iPhone/Build/Products/Release-iphoneos/MihonReader.app \
            artifacts/MihonReader-iPhone-UNSIGNED.zip

      - name: Explain installation requirements
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Native iPhone app compiled
          - Simulator ZIP: runs in a compatible Xcode iOS Simulator, not on an iPhone.
          - iPhone UNSIGNED ZIP: native device build, **not directly installable**.
          - A signed IPA requires an Apple certificate and provisioning profile, or local signing with Xcode.
          - No Apple signing credentials are included in this repository.
          - Build success does not replace UI tests on iPhone 12 and the actual installed iOS version.
          EOF

      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MihonReader-build-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
